services:
  api:
    build:
      context: .
      args:
        INSTALL_RAG: ${INSTALL_RAG:-false}
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/smartops.db
      LLM_MODE: ${LLM_MODE:-demo}
    volumes:
      - smartops-data:/data
      - ${SMARTOPS_DOCUMENTS_PATH:-./documents}:/documents:rw

volumes:
  smartops-data:

